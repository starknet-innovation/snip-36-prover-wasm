name: Build V2 browser modules
on:
  workflow_call:
permissions:
  contents: read
jobs:
  wasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 2
      WASM_CC: clang
      WASM_AR: llvm-ar
      PYTHON310: python3.10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install Wasm C compiler
        run: sudo apt-get update && sudo apt-get install -y clang llvm libgmp-dev
      - name: Build pinned executor
        run: ./scripts/build.sh executor
      - name: Build pinned V2 prover
        run: ./scripts/build.sh prover
      - name: Verify source-built modules
        run: python3 scripts/source-assets.py verify
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-wasm-v2
          path: |
            web/auth/browser_virtual_os*
            web/sequencer-prover.wasm
            build/source-assets.json
          if-no-files-found: error
          retention-days: 7
