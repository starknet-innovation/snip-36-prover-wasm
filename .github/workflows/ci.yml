name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  compiler:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"
      - run: python scripts/prepare-compiler.py
      - run: pip install --no-deps build/compiler-source/cairo-lang-0.14.3a3
      - run: pip install -r patches/executor/python-requirements.txt
      - run: pip check
      - run: python scripts/check-compiler.py
  executor-dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Test executor manifest consistency guards
        run: python3 -m unittest discover -s tests -p 'test_executor_manifests.py'
      - name: Test prover preparation and resolution guards
        run: python3 -m unittest discover -s tests -p 'test_prover*.py'
      - name: Prepare the pinned executor workspace
        run: python3 scripts/prepare-sources.py executor
      - name: Resolve the mirror and real sources with the reviewed lock
        run: python3 scripts/executor_manifests.py resolve
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit
      - run: npm test
      - name: Check JavaScript and shell syntax
        run: |
          for f in scripts/*.mjs web/*.mjs; do node --check "$f"; done
          bash -n scripts/build.sh
  prover-dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Prepare baseline, candidate and pristine verifier independently
        run: |
          python3 scripts/prepare-sources.py prover
          python3 scripts/prepare-sources.py prover-memory
          python3 scripts/prepare-sources.py native
      - name: Test proof-boundary verdict rules
        run: rustc --edition 2021 --test native/boundary_rules.rs -o build/boundary-rules-test && build/boundary-rules-test
      - name: Check actual locked Cargo resolution
        run: |
          port_rust=$(python3 -c 'import json; print(json.load(open("pins.json"))["rust"])')
          rustup toolchain install "$port_rust" --profile minimal
          cargo +"$port_rust" metadata --locked --format-version 1 --filter-platform wasm64-unknown-unknown --no-default-features --manifest-path build/baseline/proving-utils/Cargo.toml > build/baseline-metadata.json
          cargo +"$port_rust" metadata --locked --format-version 1 --filter-platform wasm64-unknown-unknown --no-default-features --manifest-path build/memory/proving-utils/Cargo.toml > build/candidate-metadata.json
          cargo +"$port_rust" metadata --locked --format-version 1 --manifest-path build/native-prover/Cargo.toml > build/native-metadata.json
          python3 scripts/check-prover-resolution.py build/baseline-metadata.json build/candidate-metadata.json build/native-metadata.json
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run demo:build
      - run: npx playwright install --with-deps chromium
      - name: Verify dedicated Worker message boundaries
        run: node scripts/worker-security-test.mjs
      - name: Replay both recorded rounds in Chromium
        run: npm run demo:test
      - name: Check wallet UI safety scenarios
        run: npm run demo:test:live
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd
        with:
          scarb-version: "2.18.0"
      - run: scarb --manifest-path contracts/coinflip/Scarb.toml build
      - run: scarb --manifest-path contracts/coinflip/Scarb.toml test

  executor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd
        with:
          scarb-version: "2.15.2"
      - run: scarb --manifest-path contracts/executor/Scarb.toml build
